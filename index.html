<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amager — Platform Literasi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Lora:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        :root { --primary: #000; --bg: #fff; --text: #1a1a1a; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        
        nav { 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            padding: 15px 5%; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 100;
        }

        .logo { font-size: 24px; font-weight: 800; text-decoration: none; color: #000; letter-spacing: -1px; }
        
        .search-bar { position: relative; flex-grow: 0.5; margin: 0 15px; }
        .search-bar input { 
            width: 100%; padding: 10px 15px 10px 35px; border: 1px solid #eee; 
            border-radius: 50px; background: #f5f5f5; outline: none;
        }
        .search-bar i { position: absolute; left: 12px; top: 12px; color: #888; }

        .container { max-width: 700px; margin: 30px auto; padding: 0 20px; }
        
        /* Gaya Kartu Artikel */
        .post-card { padding: 25px 0; border-bottom: 1px solid #f0f0f0; transition: 0.2s; cursor: pointer; }
        .post-card:hover { opacity: 0.7; }
        .post-card h2 { font-size: 26px; margin: 5px 0; letter-spacing: -0.5px; }
        .post-card p { font-family: 'Lora', serif; color: #666; font-size: 16px; line-height: 1.6; }

        /* Detail Artikel */
        .detail h1 { font-size: 38px; margin-bottom: 15px; letter-spacing: -1px; }
        .detail .content { font-family: 'Lora', serif; font-size: 19px; line-height: 1.8; color: #333; }
        
        .btn-write { 
            background: #000; color: #fff; padding: 8px 20px; 
            border-radius: 50px; text-decoration: none; font-size: 14px; font-weight: 600; 
        }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo" onclick="window.location.hash=''; location.reload();">AMAGER.</a>
    <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Cari tulisan..." onkeyup="handleSearch()">
    </div>
    <a href="tulis.html" class="btn-write">Tulis</a>
</nav>

<div class="container" id="main-content">
    <div style="text-align: center; margin-top: 50px;">Memuat konten...</div>
</div>

<script>
    // Konfigurasi Firebase Anda
    const firebaseConfig = {
        apiKey: "AIzaSyCTvPUfC1xSlup78dtXfs0AFogOUheAi-E",
        authDomain: "tikfoll.firebaseapp.com",
        databaseURL: "https://tikfoll-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "tikfoll",
        storageBucket: "tikfoll.firebasestorage.app",
        messagingSenderId: "210219887620",
        appId: "1:210219887620:web:ad7c29c37ff0f74f3ed951"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Fungsi Utama Routing
    function router() {
        const hash = window.location.hash.replace('#', '');
        const contentDiv = document.getElementById('main-content');

        if (hash) {
            // Tampilan Baca Artikel
            db.ref('posts/' + hash).once('value', (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    contentDiv.innerHTML = `
                        <div class="detail">
                            <a href="#" onclick="window.location.hash=''; return false;" style="color: #666; text-decoration: none;">← Kembali</a>
                            <h1>${data.judul}</h1>
                            <div class="content">${data.konten}</div>
                        </div>
                    `;
                    document.title = data.judul;
                } else {
                    contentDiv.innerHTML = "<h2>404</h2><p>Artikel tidak ditemukan.</p>";
                }
            });
        } else {
            // Tampilan Beranda
            loadAllPosts();
        }
    }

    function loadAllPosts(query = "") {
        db.ref('posts').on('value', (snapshot) => {
            let html = "";
            snapshot.forEach((child) => {
                const data = child.val();
                if (data.judul.toLowerCase().includes(query.toLowerCase())) {
                    html += `
                    <div class="post-card" onclick="window.location.hash='${child.key}'">
                        <h2>${data.judul}</h2>
                        <p>${data.konten.substring(0, 100)}...</p>
                    </div>`;
                }
            });
            document.getElementById('main-content').innerHTML = html || "Belum ada tulisan.";
        });
    }

    function handleSearch() {
        const q = document.getElementById('searchInput').value;
        loadAllPosts(q);
    }

    // Jalankan router saat halaman dimuat atau hash berubah
    window.addEventListener('hashchange', router);
    window.onload = router;
</script>
</body>
</html>
